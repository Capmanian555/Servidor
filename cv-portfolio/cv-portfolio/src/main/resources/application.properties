spring.application.name=cv-portfolio
# Vercel/Render indican el puerto en la variable PORT
server.port=${PORT:8080}

# Nombre que se muestra en el curriculum (Hito 1)
cv.nombre=Angel Capmany Sanchez

# Maximo de proyectos del editor (Hito 3)
portfolio.max-proyectos=5

# i18n: sin fallback al idioma del sistema, asi "es" usa messages.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
